version: '3.8'

services:
  trihonor-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trihonor-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    networks:
      - trihonor-network

  trihonor-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trihonor-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - trihonor-backend
    networks:
      - trihonor-network

networks:
  trihonor-network:
    driver: bridge
